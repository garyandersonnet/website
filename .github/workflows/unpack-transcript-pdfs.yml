name: Unpack transcript PDFs
on:
  push:
    branches: [restore/transcript-pdfs]
    paths:
      - ".github/workflows/unpack-transcript-pdfs.yml"
      - "assets/transcripts/_pack/**"
  workflow_dispatch:
jobs:
  unpack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: restore/transcript-pdfs
          fetch-depth: 0
      - name: Download and unpack transcript PDFs
        env:
          PACK_URL: https://6aaabf7f921e47fb8677490e--publiusnakamotonet.netlify.app/transcripts-108.tar.gz
          PACK_SHA256: 67e3c6f74526680e518cd30725ab81c12d9905b5861855ff5934ca6450890df1
        run: |
          set -euo pipefail
          mkdir -p assets/transcripts
          curl -fsSL "$PACK_URL" -o /tmp/transcripts-108.tar.gz
          echo "$PACK_SHA256  /tmp/transcripts-108.tar.gz" | sha256sum -c -
          tar -xzf /tmp/transcripts-108.tar.gz -C assets/transcripts
          rm -rf assets/transcripts/_pack
          rm -f assets/transcripts/_encoding_smoke.bin assets/transcripts/_b64_probe.pdf assets/transcripts/.gitkeep
          COUNT=$(ls assets/transcripts/*.pdf | wc -l)
          echo "PDF count=$COUNT"
          test -f assets/transcripts/PSYC-100_transcript.pdf
          test "$COUNT" -eq 108
          du -sh assets/transcripts
          git config user.name "Grok Bot"
          git config user.email "publiusnakamoto@hotmail.com"
          git add -A assets/transcripts
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Restore assets/transcripts PDFs from All Transcripts — via Grok Bot"
          git push origin HEAD:restore/transcript-pdfs
