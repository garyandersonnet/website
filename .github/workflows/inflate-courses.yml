name: Inflate courses.json
on:
  workflow_dispatch:
  push:
    paths:
      - "assets/courses.json.zlib.b64"
      - ".github/workflows/inflate-courses.yml"
permissions:
  contents: write
jobs:
  inflate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode zlib.b64 to courses.json
        run: |
          python3 - <<'PY'
          import base64, zlib, pathlib
          b64 = pathlib.Path("assets/courses.json.zlib.b64").read_text().strip()
          raw = zlib.decompress(base64.b64decode(b64))
          pathlib.Path("assets/courses.json").write_bytes(raw)
          print("wrote", len(raw), "bytes")
          PY
      - name: Commit courses.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/courses.json
          git diff --staged --quiet || git commit -m "Inflate full courses.json from zlib.b64"
          git push
